<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Masuk - Project Payment Monitoring System</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="{{ url_for('static', filename='css/base.css') }}"
      rel="stylesheet"
    />
    <link
      href="{{ url_for('static', filename='css/app.css') }}"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="auth-wrap">
      <form class="auth-card" method="post" action="{{ url_for('auth.login', next=request.args.get('next', '')) }}" id="loginForm" novalidate>
        <div class="auth-brand">
          <i class="bi bi-file-earmark-spreadsheet-fill"></i>
        </div>
        <p class="auth-kicker">PROJECT PAYMENT</p>
        <h1 class="auth-title">Monitoring System</h1>
        <p class="auth-sub">Masuk untuk monitoring invoice.</p>
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for cat, msg in messages %}
        <div class="auth-alert" role="alert"><i class="bi bi-exclamation-circle-fill"></i><span>{{ msg }}</span></div>
        {% endfor %}
        {% endif %}
        {% endwith %}
        <label class="auth-label" for="password">KATA SANDI</label>
        <div class="auth-field">
          <i class="bi bi-lock-fill auth-field-icon"></i>
          <input
            class="form-control auth-input"
            type="password"
            id="password"
            name="password"
            placeholder="Masukkan password"
            autocomplete="current-password"
            autofocus
            required
          />
          <button class="auth-toggle" type="button" id="togglePw" aria-label="Tampilkan password" title="Tampilkan password">
            <i class="bi bi-eye"></i>
          </button>
        </div>
        <button class="ds-btn ds-btn--primary auth-btn" type="submit" id="loginBtn">
          <i class="bi bi-box-arrow-in-right"></i><span>Masuk</span>
        </button>
        <p class="auth-hint"><i class="bi bi-shield-lock"></i> Akses Internal</p>
      </form>
    </div>
    <script>
      (function () {
        var toggle = document.getElementById('togglePw');
        var pw = document.getElementById('password');
        toggle.addEventListener('click', function () {
          var show = pw.type === 'password';
          pw.type = show ? 'text' : 'password';
          toggle.innerHTML = show ? '<i class="bi bi-eye-slash"></i>' : '<i class="bi bi-eye"></i>';
          toggle.setAttribute('aria-label', show ? 'Sembunyikan password' : 'Tampilkan password');
          pw.focus();
        });
        document.getElementById('loginForm').addEventListener('submit', function () {
          if (!pw.value) { pw.focus(); return; }
          var btn = document.getElementById('loginBtn');
          btn.disabled = true;
          btn.innerHTML = '<span class="auth-spin"></span><span>Memeriksa…</span>';
        });
      })();
    </script>
  </body>
</html>
