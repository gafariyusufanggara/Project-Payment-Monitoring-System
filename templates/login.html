<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#16324f" />
    <title>Masuk - Project Payment Monitoring System</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2316324f'/%3E%3Cpath d='M20 12h18l12 12v28H20z' fill='none' stroke='%23fff' stroke-width='4' stroke-linejoin='round'/%3E%3Cpath d='M38 12v14h12M26 36h18M26 44h18' fill='none' stroke='%230f766e' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="{{ url_for('static', filename='css/base.css') }}"
      rel="stylesheet"
    />
    <link
      href="{{ url_for('static', filename='css/app.css') }}"
      rel="stylesheet"
    />
    <style>
      .auth-wrap {
        background: radial-gradient(ellipse at 50% 0%, rgba(15, 118, 110, .09), transparent 52%), var(--bg);
      }
      .auth-card {
        max-width: 410px;
        padding: 36px 32px 28px;
        border-color: rgba(22, 50, 79, .12);
        box-shadow: 0 20px 60px rgba(22, 50, 79, .11), 0 2px 8px rgba(22, 50, 79, .04);
      }
      .auth-brand {
        width: 58px;
        height: 58px;
        margin-bottom: 18px;
        box-shadow: 0 8px 18px rgba(22, 50, 79, .18);
      }
      .auth-kicker { letter-spacing: 1.2px; }
      .auth-title { font-size: 1.25rem; letter-spacing: -.02em; }
      .auth-sub { margin-bottom: 24px; }
      .auth-field .auth-input { height: 48px; }
      .auth-toggle { width: 44px; height: 44px; }
      .auth-btn { min-height: 48px; margin-top: 4px; }
      .auth-btn:not(:disabled) { transition: transform .16s ease, box-shadow .16s ease; }
      .auth-btn:not(:disabled):hover { transform: translateY(-1px); box-shadow: 0 5px 14px rgba(15, 118, 110, .2); }
      .auth-hint { margin-top: 20px; }
      @media (max-width: 480px) {
        .auth-wrap { align-items: flex-start; padding: max(24px, 8vh) 16px 20px; }
        .auth-card { padding: 30px 22px 24px; }
      }
      @media (prefers-reduced-motion: reduce) {
        .auth-btn:not(:disabled) { transition: none; }
        .auth-btn:not(:disabled):hover { transform: none; }
      }
    </style>
  </head>
  <body>
    <div class="auth-wrap">
      <form class="auth-card" method="post" action="{{ url_for('auth.login', next=request.args.get('next', '')) }}" id="loginForm" novalidate>
        <div class="auth-brand" aria-hidden="true">
          <i class="bi bi-file-earmark-spreadsheet-fill"></i>
        </div>
        <p class="auth-kicker">PROJECT PAYMENT</p>
        <h1 class="auth-title">Monitoring System</h1>
        <p class="auth-sub">Masuk untuk monitoring invoice.</p>
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for cat, msg in messages %}
        <div class="auth-alert" role="alert"><i class="bi bi-exclamation-circle-fill"></i><span>{{ msg }}</span></div>
        {% endfor %}
        {% endif %}
        {% endwith %}
        <label class="auth-label" for="password">KATA SANDI</label>
        <div class="auth-field">
          <i class="bi bi-lock-fill auth-field-icon"></i>
          <input
            class="form-control auth-input"
            type="password"
            id="password"
            name="password"
            placeholder="Masukkan password"
            autocomplete="current-password"
            autofocus
            required
          />
          <button class="auth-toggle" type="button" id="togglePw" aria-label="Tampilkan password" title="Tampilkan password">
            <i class="bi bi-eye"></i>
          </button>
        </div>
        <button class="ds-btn ds-btn--primary auth-btn" type="submit" id="loginBtn">
          <i class="bi bi-box-arrow-in-right"></i><span>Masuk</span>
        </button>
        <p class="auth-hint"><i class="bi bi-shield-lock"></i> Akses Internal</p>
      </form>
    </div>
    <script>
      (function () {
        var toggle = document.getElementById('togglePw');
        var pw = document.getElementById('password');
        toggle.addEventListener('click', function () {
          var show = pw.type === 'password';
          pw.type = show ? 'text' : 'password';
          toggle.innerHTML = show ? '<i class="bi bi-eye-slash"></i>' : '<i class="bi bi-eye"></i>';
          toggle.setAttribute('aria-label', show ? 'Sembunyikan password' : 'Tampilkan password');
          pw.focus();
        });
        document.getElementById('loginForm').addEventListener('submit', function () {
          if (!pw.value) { pw.focus(); return; }
          var btn = document.getElementById('loginBtn');
          btn.disabled = true;
          btn.innerHTML = '<span class="auth-spin"></span><span>Memeriksa…</span>';
        });
      })();
    </script>
  </body>
</html>
